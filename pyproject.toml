[project]
name = "hapax-mcp"
version = "0.1.0"
description = "Experimental Model Context Protocol stdio research tooling from Hapax Research Lab for Logos HTTP API deployments"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hapax Research Lab", email = "hrl-han@hapaxresearch.com" }]
dependencies = [
    "mcp>=1.26",
    "httpx>=0.28.1",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://hapaxresearch.com"
Repository = "https://github.com/hapax-systems/hapax-mcp"

[project.scripts]
hapax-mcp = "hapax_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["hapax_mcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
