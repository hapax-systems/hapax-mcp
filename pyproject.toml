[project]
name = "hapax-mcp"
version = "0.1.0"
description = "MCP server wrapping the hapax logos API"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "mcp>=1.28.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
hapax-mcp = "hapax_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["hapax_mcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
