[project]
name = "cockpit-mcp"
version = "0.1.0"
description = "MCP server wrapping the hapax cockpit API"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.26",
    "httpx>=0.28",
]

[project.scripts]
cockpit-mcp = "cockpit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
